<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pepe Mood Year - Tu Diario</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="https://i.imgur.com/3OaT1ef.png" type="image/png">
    <link rel="apple-touch-icon" href="https://i.imgur.com/3OaT1ef.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        -webkit-tap-highlight-color: transparent;
      }
      body {
        font-family: 'Nunito', sans-serif;
        background-color: #020617;
        margin: 0;
        overflow-x: hidden;
        touch-action: manipulation; /* Optimiza clicks en móviles */
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a; 
      }
      ::-webkit-scrollbar-thumb {
        background: #334155; 
        border-radius: 10px;
      }

      .bg-glow {
        position: fixed;
        inset: 0;
        z-index: -2;
        background: radial-gradient(circle at 50% 50%, #0f172a 0%, #020617 100%);
        overflow: hidden;
      }
      
      .bg-glow::before {
        content: "";
        position: absolute;
        top: -20%;
        left: -10%;
        width: 60%;
        height: 60%;
        background: radial-gradient(circle, rgba(34, 197, 94, 0.08) 0%, transparent 70%);
        filter: blur(80px);
        animation: pulse-glow 15s infinite alternate;
        will-change: transform, opacity;
      }

      @keyframes shimmer {
        0% { background-position: -200% center; }
        100% { background-position: 200% center; }
      }
      .animate-shimmer {
        background-size: 200% auto;
        animation: shimmer 6s linear infinite;
      }
      
      .pepe-float {
        animation: float 4s ease-in-out infinite;
        will-change: transform;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }

      @keyframes pulse-glow {
        0% { transform: translate(0, 0) scale(1); opacity: 0.5; }
        100% { transform: translate(5%, 5%) scale(1.1); opacity: 0.8; }
      }

      .magic-channeling {
        animation: magic-vibrate 0.3s ease-in-out infinite;
        will-change: transform, filter;
      }
      @keyframes magic-vibrate {
        0%, 100% { transform: scale(1) rotate(0deg); filter: brightness(1); }
        25% { transform: scale(1.01) rotate(0.2deg); filter: brightness(1.2); }
        75% { transform: scale(0.99) rotate(-0.2deg); filter: brightness(1.1); }
      }
      
      /* Animación de Texto Líquido para el Oráculo */
      @keyframes text-flow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      .animate-text-flow {
        background-size: 200% auto;
        animation: text-flow 4s linear infinite;
      }

      /* Animaciones de Portal y Partículas */
      @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spin-reverse-slow {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes orbit-cw {
        0% { transform: rotate(0deg) translateX(60px) rotate(0deg); }
        100% { transform: rotate(360deg) translateX(60px) rotate(-360deg); }
      }
      @keyframes orbit-ccw {
        0% { transform: rotate(360deg) translateX(70px) rotate(-360deg); }
        100% { transform: rotate(0deg) translateX(70px) rotate(0deg); }
      }
      
      /* Clases de utilidad para animaciones */
      .animate-spin-slow {
        animation: spin-slow 12s linear infinite;
      }
      .animate-spin-reverse-slow {
        animation: spin-reverse-slow 15s linear infinite;
      }

      /* Optimización de rendimiento para filtros costosos */
      @media (max-width: 768px) {
        .backdrop-blur-md, .backdrop-blur-xl, .backdrop-blur-3xl {
          backdrop-filter: blur(8px) !important; /* Menor intensidad en móviles */
          -webkit-backdrop-filter: blur(8px) !important;
        }
      }
    </style>
