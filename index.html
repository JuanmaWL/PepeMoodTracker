<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pepe Mood Year - Tu Diario</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐸</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family: 'Nunito', sans-serif;
        background-color: #020617;
        margin: 0;
        overflow-x: hidden;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a; 
      }
      ::-webkit-scrollbar-thumb {
        background: #334155; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569; 
      }

      /* Background layers */
      .bg-glow {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -2; /* Más profundo que las partículas */
        background: radial-gradient(circle at 50% 50%, #0f172a 0%, #020617 100%);
        overflow: hidden;
      }
      
      .bg-glow::before {
        content: "";
        position: absolute;
        top: -20%;
        left: -10%;
        width: 60%;
        height: 60%;
        background: radial-gradient(circle, rgba(34, 197, 94, 0.08) 0%, transparent 70%);
        filter: blur(80px);
        animation: pulse-glow 15s infinite alternate;
      }

      /* Partículas */
      .particle {
        position: fixed;
        background: white;
        border-radius: 50%;
        pointer-events: none;
        z-index: -1; /* Encima del fondo pero detrás del contenido */
        opacity: 0;
        animation: float-particle linear infinite;
      }
      @keyframes float-particle {
        0% { transform: translateY(105vh) scale(0.3); opacity: 0; }
        20% { opacity: 0.6; }
        80% { opacity: 0.6; }
        100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
      }

      @keyframes shimmer {
        0% { background-position: -200% center; }
        100% { background-position: 200% center; }
      }
      .animate-shimmer {
        background-size: 200% auto;
        animation: shimmer 6s linear infinite;
      }
      
      .pepe-float {
        animation: float 4s ease-in-out infinite;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }

      @keyframes pulse-glow {
        0% { transform: translate(0, 0) scale(1); opacity: 0.5; }
        100% { transform: translate(5%, 5%) scale(1.1); opacity: 0.8; }
      }

      .magic-channeling {
        animation: magic-vibrate 0.3s ease-in-out infinite;
      }
      @keyframes magic-vibrate {
        0%, 100% { transform: scale(1) rotate(0deg); filter: brightness(1); }
        25% { transform: scale(1.02) rotate(0.5deg); filter: brightness(1.3); }
        75% { transform: scale(0.98) rotate(-0.5deg); filter: brightness(1.1); }
      }
    </style>
<script type="importmap">
{

}
</script>
</head>

</body>
</html>
