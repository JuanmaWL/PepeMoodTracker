
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pepe Pixel Year | Mood Tracker</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="https://sme2zz26xzjq57zw.public.blob.vercel-storage.com/favicon_2.png" type="image/png">
    <link rel="apple-touch-icon" href="https://sme2zz26xzjq57zw.public.blob.vercel-storage.com/favicon_2.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        -webkit-tap-highlight-color: transparent;
      }
      body {
        font-family: 'Nunito', sans-serif;
        background-color: #020617;
        margin: 0;
        overflow-x: hidden;
        touch-action: manipulation; /* Optimiza clicks en móviles */
        user-select: none; /* Previene selección de texto al hacer long press */
        -webkit-user-select: none;
        -webkit-touch-callout: none; /* Previene menú contextual en iOS */
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a; 
      }
      ::-webkit-scrollbar-thumb {
        background: #334155; 
        border-radius: 10px;
      }

      .bg-glow {
        position: fixed;
        inset: 0;
        z-index: -2;
        background: radial-gradient(circle at 50% 50%, #0f172a 0%, #020617 100%);
        overflow: hidden;
      }
      
      .bg-glow::before {
        content: "";
        position: absolute;
        top: -20%;
        left: -10%;
        width: 60%;
        height: 60%;
        background: radial-gradient(circle, rgba(34, 197, 94, 0.08) 0%, transparent 70%);
        filter: blur(80px);
        animation: pulse-glow 15s infinite alternate;
        will-change: transform, opacity;
      }

      @keyframes shimmer {
        0% { background-position: -200% center; }
        100% { background-position: 200% center; }
      }
      .animate-shimmer {
        background-size: 200% auto;
        animation: shimmer 6s linear infinite;
      }
      
      .pepe-float {
        animation: float 4s ease-in-out infinite;
        will-change: transform;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }

      @keyframes pulse-glow {
        0% { transform: translate(0, 0) scale(1); opacity: 0.5; }
        100% { transform: translate(5%, 5%) scale(1.1); opacity: 0.8; }
      }

      .magic-channeling {
        animation: magic-vibrate 0.3s ease-in-out infinite;
        will-change: transform, filter;
      }
      @keyframes magic-vibrate {
        0%, 100% { transform: scale(1) rotate(0deg); filter: brightness(1); }
        25% { transform: scale(1.01) rotate(0.2deg); filter: brightness(1.2); }
        75% { transform: scale(0.99) rotate(-0.2deg); filter: brightness(1.1); }
      }
      
      /* Animación de Texto Líquido para el Oráculo */
      @keyframes text-flow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      .animate-text-flow {
        background-size: 200% auto;
        animation: text-flow 4s linear infinite;
      }

      /* Animaciones de Portal y Partículas */
      @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spin-reverse-slow {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes orbit-cw {
        0% { transform: rotate(0deg) translateX(60px) rotate(0deg); }
        100% { transform: rotate(360deg) translateX(60px) rotate(-360deg); }
      }
      @keyframes orbit-ccw {
        0% { transform: rotate(360deg) translateX(70px) rotate(-360deg); }
        100% { transform: rotate(0deg) translateX(70px) rotate(0deg); }
      }
      
      /* Clases de utilidad para animaciones */
      .animate-spin-slow {
        animation: spin-slow 12s linear infinite;
      }
      .animate-spin-reverse-slow {
        animation: spin-reverse-slow 15s linear infinite;
      }

      /* Optimización de rendimiento para filtros costosos */
      @media (max-width: 768px) {
        .backdrop-blur-md, .backdrop-blur-xl, .backdrop-blur-3xl {
          backdrop-filter: blur(8px) !important; /* Menor intensidad en móviles */
          -webkit-backdrop-filter: blur(8px) !important;
        }
      }

      /* --- ECO MODE / PATATA MODE --- */
      body.eco-mode * {
          backdrop-filter: none !important;
          -webkit-backdrop-filter: none !important;
          box-shadow: none !important;
          animation: none !important;
          transition: none !important;
      }

      body.eco-mode .bg-glow::before {
          display: none;
      }
      
      body.eco-mode .backdrop-blur-md, 
      body.eco-mode .backdrop-blur-xl, 
      body.eco-mode .backdrop-blur-3xl,
      body.eco-mode .bg-slate-900\/95,
      body.eco-mode .bg-slate-950\/80 {
          background-color: #0f172a !important; /* Solid fallback */
          opacity: 1 !important;
      }

      /* --- KEYFRAMES CONSOLIDADOS --- */
      @keyframes pixel-breath {
        0% { opacity: 0; transform: scale(0.5); }
        30% { opacity: 0.8; transform: scale(1); }
        70% { opacity: 0.8; transform: scale(1); }
        100% { opacity: 0; transform: scale(0.5); }
      }
      @keyframes scan {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100%); }
      }
      @keyframes bounceIn {
        0% { opacity: 0; transform: translateY(-100px) scale(0.5); }
        60% { opacity: 1; transform: translateY(20px) scale(1.1); }
        80% { transform: translateY(-5px) scale(0.95); }
        100% { transform: translateY(0) scale(1); }
      }
      @keyframes implodeOut {
        0% { opacity: 1; transform: translateY(0) scale(1); filter: brightness(1); }
        30% { opacity: 1; transform: translateY(0) scale(1.1); filter: brightness(1.5); }
        100% { opacity: 0; transform: translateY(0) scale(0) rotate(720deg); filter: brightness(3) blur(20px); }
      }
      @keyframes spin-border {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes god-rays {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulse-shadow {
        0%, 100% { box-shadow: 0 0 20px var(--toast-color-40, rgba(34,197,94,0.25)), 0 0 40px var(--toast-color-20, rgba(34,197,94,0.12)); }
        50% { box-shadow: 0 0 50px var(--toast-color-80, rgba(34,197,94,0.5)), 0 0 80px var(--toast-color-40, rgba(34,197,94,0.25)); }
      }
      @keyframes shimmer-fast {
        0% { transform: translateX(-150%) skewX(-15deg); }
        100% { transform: translateX(150%) skewX(-15deg); }
      }
      @keyframes pepe-breath {
        0%, 100% { transform: scale(0.95); opacity: 0.8; }
        50% { transform: scale(1.05); opacity: 1; }
      }
      @keyframes jelly-pop {
        0% { transform: scale(1); }
        30% { transform: scale(1.15, 0.85); }
        40% { transform: scale(0.85, 1.15); }
        50% { transform: scale(1.05, 0.95); }
        65% { transform: scale(0.98, 1.02); }
        75% { transform: scale(1.02, 0.98); }
        100% { transform: scale(1); }
      }
      @keyframes card-pulse-shadow {
        0%, 100% { box-shadow: 0 0 15px var(--pulse-color); }
        50% { box-shadow: 0 0 35px var(--pulse-color); }
      }
      @keyframes liquid-rotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes organic-float {
        0%, 100% { transform: translate3d(0,0,0) translateY(0) rotate(0deg); }
        33% { transform: translate3d(0,0,0) translateY(-6px) rotate(2deg); }
        66% { transform: translate3d(0,0,0) translateY(3px) rotate(-1deg); }
      }
      @keyframes border-glow-pulse {
        0%, 100% { opacity: 0.5; box-shadow: 0 0 10px currentColor; }
        50% { opacity: 1; box-shadow: 0 0 25px currentColor; }
      }
      @keyframes bubble-rise {
        0% { transform: translateY(100%) scale(0.5); opacity: 0; }
        20% { opacity: 0.5; }
        80% { opacity: 0.5; }
        100% { transform: translateY(-20%) scale(1.2); opacity: 0; }
      }
      .mood-card-selected {
        animation:
          jelly-pop 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards,
          card-pulse-shadow 3s infinite ease-in-out;
        backface-visibility: hidden;
        transform: translate3d(0,0,0);
        will-change: transform, box-shadow;
      }
      .liquid-bg {
        background-size: 200% 200%;
        animation: liquid-rotate 10s linear infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }

    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",

    "recharts": "https://esm.sh/recharts@^3.6.0"
  }
}
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(req => console.log('Service Worker Registered'))
        .catch(err => {
            if (err.message && (err.message.includes('origin') || err.message.includes('scriptURL'))) {
                console.warn('Service Worker: Omitido debido a restricciones del entorno de desarrollo (Preview/Cross-Origin). Funcionará en producción.');
            } else {
                console.log('Service Worker Failed', err);
            }
        });
    });
  }
</script>
</head>
<body class="text-slate-100 min-h-screen">
    <div class="bg-glow"></div>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
